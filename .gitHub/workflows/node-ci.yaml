name: Node.JS CI Pipeline
on:
  push:
    branches:
      - main
      pull_request:

      workflow_dispatch:

      permissions:
        contents: read

      jobs:
        build:
          runs-on: ubuntu-latest

          steps:
            - name: checkout source code
              uses: action/checkout@v4
               -name: steup node.js
               uses: action/setup-node@v4
               with:
                  node-version:24

                  -name: Install dependencies
                  run:npm ci
                  -name: run tests
                  run:npm test
                  -name: build application
                  run: npm run build
                  -name: upload build artifact
                  uses: actions/upload-artifact@v4
                  with:
                    name: node-build-artifact
                    path: dist/
                    - name: Verify Secret Access
  env:
    CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  run: |
    echo "Service Principal Client ID length is: ${#CLIENT_ID}"
       
